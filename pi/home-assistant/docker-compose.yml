services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: kahrabaiq-homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: Asia/Bahrain
    volumes:
      - /var/lib/kahrabaiq/homeassistant:/config
      - /run/dbus:/run/dbus:ro

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: kahrabaiq-matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/lib/kahrabaiq/matter-server:/data
